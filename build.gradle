plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.sonarqube' version '6.2.0.5505'
}

group = 'com.graydoll'
version = '1.0.0'

jacoco {
    toolVersion = '0.8.12'
}
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
sonar {
    properties {
        property 'sonar.projectKey', 'ManuelAlvarez-R_Actividad1-calidad-de-software'
        property 'sonar.organization', 'manuelalvarez-r'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.java.source', '17'
        property 'sonar.coverage.jacoco.xmlReportPaths',
            layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.path
        property 'sonar.junit.reportPaths',
            layout.buildDirectory.dir('test-results/test').get().asFile.path
        // La GUI Swing no tiene tests; si no se excluye, baja el coverage global.
        property 'sonar.coverage.exclusions', '**/CalculatorApp.java'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.graydoll.calculadora.CalculatorApp'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = false
    }

    afterSuite { descriptor, result ->
        def elapsed = String.format('%.3f', (result.endTime - result.startTime) / 1000.0)
        if (descriptor.parent) {
            println "Running ${descriptor.name}"
            println "Tests run: ${result.testCount}, Failures: ${result.failedTestCount}, Errors: 0, Skipped: ${result.skippedTestCount}, Time elapsed: ${elapsed} s"
            println()
        } else {
            println '-------------------------------------------------------'
            println ' T E S T S'
            println '-------------------------------------------------------'
            println()
            println 'Results :'
            println()
            println "Tests run: ${result.testCount}, Failures: ${result.failedTestCount}, Errors: 0, Skipped: ${result.skippedTestCount}"
            println()
        }
    }
}
